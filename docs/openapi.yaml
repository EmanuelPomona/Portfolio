openapi: 3.1.0
info:
  title: emanuel-ling portfolio
  version: 1.0.0
  description: |
    This project has NO HTTP API (docs/DECISIONS.md, ADR-001). It is a static site.

    The cross-agent contracts are in-repo TypeScript modules, documented in docs/API.md:
      - content: frontend/src/content/types.ts and media.ts
      - stickman: frontend/src/stickman/types.ts and index.ts
      - flags: frontend/src/config/flags.ts

    `x-no-http-api: true` tells scripts/contract-test.sh to run `npm run test:contract`
    (typecheck plus every *contract* test) instead of probing a server.
    Adding a real endpoint means removing that flag and documenting it here and in docs/API.md.
x-no-http-api: true
paths: {}
